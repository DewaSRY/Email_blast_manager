[package]
name = "email-validator"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["json", "multipart"] }
email_address = "0.2"
hickory-resolver = "0.24"
idna = "1.0"
serde = { version = "1.0.229", features = ["derive"] } 
tokio = { version = "1.53.2", features = ["full", "macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
unicode-normalization = "0.1"
calamine = "0.36.1"
csv = "1.4.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "json", "migrate"] }
sha2 = "0.11.1"
serde_json = "1.0.154"
