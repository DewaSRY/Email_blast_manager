services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_validator}
      POSTGRES_USER: ${POSTGRES_USER:-email_validator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email_validator} -d ${POSTGRES_DB:-email_validator}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY in .env}
      SMTP_REACHABILITY_ENABLED: ${SMTP_REACHABILITY_ENABLED:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_EMAILS_PER_JOB: ${MAX_EMAILS_PER_JOB:-10000}
      BIND_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8080
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY in .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on: [api]
    networks: [private]

volumes:
  pgdata:
networks:
  private:
