services: 
  postgress:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql



  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes: 
  postgres_data: 