services: 
  postgress:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5447:5432"
    volumes:
      - email_blast_data:/var/lib/postgresql



  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes: 
  email_blast_data: 